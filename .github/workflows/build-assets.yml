# Compile le CSS et le JavaScript (Vite) à chaque modification et enregistre
# public/build dans le dépôt : sur l'hébergement mutualisé (LWS), un simple
# « git pull » suffit alors, sans Node.js sur le serveur.
name: Compilation des fichiers du site

on:
  push:
    branches: [main]
    paths:
      - 'resources/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/build-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Enregistrer public/build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add -f public/build
          if git diff --cached --quiet; then
            echo "Fichiers compilés déjà à jour."
          else
            git commit -m "Compilation des fichiers du site (CSS/JS)"
            git push
          fi
